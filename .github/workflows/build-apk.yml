name: Build 73MCT Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP when repository contains only the ZIP
        shell: bash
        run: |
          if [ ! -f "app/build.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" ! -path "./.git/*" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "No Android project and no source ZIP found."
              exit 1
            fi
            echo "Extracting $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d .
          fi
          test -f app/build.gradle
          test -f settings.gradle
          find app/src/main -type f | sort | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 73MCT-v12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 73MCT-build-reports
          path: app/build/reports/
          if-no-files-found: ignore
